[package]
name = "nanograph-py"
version = "1.3.0"
edition = "2024"
description = "NanoGraph Python SDK via PyO3 (spike)"
license = "MIT"

[lib]
name = "nanograph_py"
crate-type = ["cdylib"]

[dependencies]
nanograph = { path = "../nanograph", version = "1.3.0" }
pyo3 = { version = "0.23", features = ["extension-module"] }
tokio = { workspace = true }
serde_json = { workspace = true }
